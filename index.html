<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2f3340">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="單字練習">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <title>英文單字練習</title>
</head>
<body>
  <!-- 首頁 -->
  <section id="home" class="screen active">
    <header class="topbar"><div class="title">英文單字練習</div></header>
    <main class="home-body">
      <div class="stats">
        <div><span id="stat-total">0</span><small>全部單字</small></div>
        <div><span id="stat-weak" class="weak-num">0</span><small>不熟單字</small></div>
      </div>

      <h3>題型</h3>
      <div class="seg" data-name="mode">
        <button data-value="meaning" class="on">選中文意思</button>
        <button data-value="pos">考詞性(複選)</button>
      </div>

      <h3>範圍</h3>
      <div class="seg" data-name="scope">
        <button data-value="all" class="on">全部</button>
        <button data-value="weak">只考不熟</button>
        <button data-value="pages">指定頁數</button>
      </div>
      <div id="page-range" class="page-range hidden">
        p.<select id="page-from"></select> ~ p.<select id="page-to"></select>
      </div>

      <h3>題數</h3>
      <div class="seg" data-name="count">
        <button data-value="10">10</button>
        <button data-value="20" class="on">20</button>
        <button data-value="50">50</button>
        <button data-value="all">全部</button>
      </div>

      <p id="home-msg" class="msg"></p>
      <button id="btn-start" class="big-btn">開始練習</button>
      <button id="btn-weaklist" class="link-btn">查看不熟單字清單 ›</button>
    </main>
  </section>

  <!-- 測驗頁 -->
  <section id="quiz" class="screen">
    <header class="topbar">
      <button id="btn-back" class="icon-btn" aria-label="返回">‹</button>
      <div id="progress" class="title">1/20</div>
      <div class="top-right">
        <button id="btn-hint" class="icon-btn" aria-label="提示"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="1.6" stroke-linecap="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg></button>
        <button id="btn-star" class="icon-btn star" aria-label="加入不熟">☆</button>
      </div>
    </header>
    <main class="quiz-body">
      <div id="word-card" class="word-card">
        <div id="word" class="word">word</div>
        <div id="word-sub" class="word-sub"></div>
      </div>
      <div id="options" class="options"></div>
      <div id="feedback" class="feedback"></div>
    </main>
    <footer class="quiz-foot">
      <button id="btn-action" class="pill-btn hidden">確認</button>
      <button id="btn-end" class="pill-btn">結 束</button>
    </footer>
  </section>

  <!-- 結果頁 -->
  <section id="result" class="screen">
    <header class="topbar"><div class="title">練習結果</div></header>
    <main class="home-body">
      <div class="score"><span id="score-pct">0%</span><small id="score-detail"></small></div>
      <h3 id="wrong-title">答錯的單字</h3>
      <ul id="wrong-list" class="word-list"></ul>
      <button id="btn-retry-wrong" class="big-btn">再練一次答錯的</button>
      <button id="btn-home" class="big-btn secondary">回首頁</button>
    </main>
  </section>

  <!-- 不熟單字清單 -->
  <section id="weaklist" class="screen">
    <header class="topbar">
      <button class="icon-btn btn-to-home" aria-label="返回">‹</button>
      <div class="title">不熟單字</div>
      <div class="top-right"></div>
    </header>
    <main class="home-body">
      <p class="msg small">答錯會自動加入;同一個單字連續答對 3 次會自動移出。點 ✕ 可手動移除。</p>
      <ul id="weak-list" class="word-list"></ul>
      <button id="btn-reset" class="link-btn danger">清除所有練習紀錄</button>
    </main>
  </section>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
